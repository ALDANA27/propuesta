<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta Especial ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="heart-icon">💖</div>
        <h1 id="question">¿Quieres ser mi novia? ❤️</h1>
        
        <div class="buttons">
            <button id="yes-btn" class="btn">¡Sí! 💕</button>
            <div class="no-wrapper">
                <button id="no-btn" class="btn">No 🙈</button>
            </div>
        </div>

        <div id="letter-window" class="letter-window">
            <div class="letter-content">
                <h2>¡SABÍA QUE DIRÍAS QUE SÍ! 🥰✨</h2>
                <p>Me haces la persona más feliz del mundo. ¡Prometo cuidarte y quererte siempre! ❤️</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
